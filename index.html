<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 文本分析工具</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(145deg, #f6f9fc, #edf2f9);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 2rem 1rem;
  }
  .container {
    max-width: 900px; width: 100%;
    background: #fff; border-radius: 2rem;
    padding: 2rem; box-shadow: 0 20px 40px -12px rgba(0,20,40,.15);
  }
  h1 { font-size: 1.8rem; color: #0b2b4a; margin-bottom: .3rem; }
  h1 span {
    background: #1e4f7a; color: #fff; font-size: .9rem;
    padding: .15rem .8rem; border-radius: 30px; margin-right: .5rem;
  }
  .sub { color: #5a7a99; font-size: .95rem; margin-bottom: 1.5rem; }
  textarea {
    width: 100%; min-height: 150px; padding: 1.2rem;
    border-radius: 1.5rem; border: 1.5px solid #d9e6f2;
    font-size: 1rem; line-height: 1.6; font-family: inherit;
    resize: vertical; color: #0b2b3f;
  }
  textarea:focus { outline: none; border-color: #4f8bc9; }
  .bar {
    display: flex; flex-wrap: wrap; gap: .6rem;
    justify-content: space-between; align-items: center; margin-top: 1rem;
  }
  .btns { display: flex; gap: .6rem; flex-wrap: wrap; }
  button {
    padding: .7rem 1.4rem; border-radius: 3rem;
    border: 1.5px solid #cbdae9; background: #fff;
    font-size: .95rem; font-weight: 500; cursor: pointer;
    color: #1e3f60; font-family: inherit; transition: .15s;
  }
  button.primary {
    background: #1e4f7a; border-color: #1e4f7a; color: #fff;
  }
  button.primary:hover { background: #0e3b5e; }
  button.summary {
    background: #2e7d5e; border-color: #2e7d5e; color: #fff;
  }
  button.summary:hover { background: #1f5e45; }
  button:not(.primary):not(.summary):hover { background: #e9f0f8; }
  .slider {
    display: flex; align-items: center; gap: .8rem;
    background: #e8f0f9; padding: .4rem 1rem; border-radius: 40px;
    font-size: .9rem; color: #1e4a72;
  }
  input[type=range] { width: 120px; }
  .panel {
    margin-top: 2rem; padding: 1.2rem 1.5rem;
    background: #f0faf5; border-radius: 1.5rem;
    border: 1px solid #c8e6d5;
  }
  .panel h2 {
    font-size: 1.15rem; color: #1f5e45; margin-bottom: .8rem;
  }
  .summary-text {
    font-size: 1rem; line-height: 1.8; color: #1a3f30;
    white-space: pre-wrap;
  }
  .results { margin-top: 2rem; }
  .results h2 { font-size: 1.2rem; color: #173f5c; margin-bottom: 1rem; }
  .item {
    display: flex; justify-content: space-between; align-items: center;
    background: #f8fcff; padding: .75rem 1.2rem; border-radius: 1.2rem;
    margin-bottom: .6rem; border: 1px solid #e2eefb;
  }
  .phrase { font-weight: 500; color: #133d5b; }
  .count {
    background: #d4e4f5; color: #12426b; font-weight: 600;
    padding: .2rem .9rem; border-radius: 40px; font-size: .85rem;
  }
  .empty {
    text-align: center; color: #6d8aa8; padding: 2rem;
    background: #f2f8fe; border-radius: 1.5rem;
    border: 1px dashed #bbd2ea;
  }
</style>
</head>
<body>
<div class="container">
  <h1><span>AI</span>文本分析工具</h1>
  <p class="sub">🔍 提取高频词组 · 📝 总结文本主要内容</p>

  <textarea id="textInput" placeholder="在此粘贴文本...">人工智能正在改变世界。人工智能技术应用于各个领域，人工智能让生活更便捷。机器学习是人工智能的核心，深度学习推动人工智能发展。自然语言处理是人工智能的重要方向。人工智能的未来充满无限可能。智能语音助手、计算机视觉都是人工智能的典型应用。人工智能与大数据、云计算紧密结合。人工智能伦理也越来越受到关注。</textarea>

  <div class="bar">
    <div class="btns">
      <button class="primary" id="extractBtn">⚡ 提取高频词组</button>
      <button class="summary" id="summaryBtn">📝 总结主要内容</button>
      <button id="clearBtn">🧹 清空</button>
      <button id="exampleBtn">📋 示例</button>
    </div>
    <div class="slider">
      <label>最少出现</label>
      <input type="range" id="minCount" min="1" max="10" value="2">
      <span id="minCountValue">2</span>
    </div>
  </div>

  <div class="panel" id="summaryPanel" style="display:none;">
    <h2>📝 内容总结</h2>
    <div class="summary-text" id="summaryText"></div>
  </div>

  <div class="results">
    <h2 id="statsText">📊 高频词组</h2>
    <div id="phrasesGrid">
      <div class="empty">点击按钮查看结果</div>
    </div>
  </div>
</div>

<script>
(function() {
  var textInput = document.getElementById('textInput');
  var extractBtn = document.getElementById('extractBtn');
  var summaryBtn = document.getElementById('summaryBtn');
  var clearBtn = document.getElementById('clearBtn');
  var exampleBtn = document.getElementById('exampleBtn');
  var minCountSlider = document.getElementById('minCount');
  var minCountValue = document.getElementById('minCountValue');
  var phrasesGrid = document.getElementById('phrasesGrid');
  var statsText = document.getElementById('statsText');
  var summaryPanel = document.getElementById('summaryPanel');
  var summaryText = document.getElementById('summaryText');

  // 内置常用词表
  var DICT = new Set([
    '人工智能','智能','人工','技术','应用','领域','生活','便捷','机器','学习',
    '核心','深度','推动','发展','自然','语言','处理','重要','方向','未来','充满',
    '无限','可能','语音','助手','计算','视觉','典型','数据','紧密','结合','伦理',
    '受到','关注','改变','世界','各个','方便','我们','他们','自己','可以','已经',
    '正在','一个','一些','很多','非常','特别','因为','所以','但是','如果','就是',
    '机器人','互联网','大数据','云计算','计算机','智能语','机器学习','深度学习',
    '自然语言','计算机视觉','语音助手','无限可能','紧密结合','越来越'
  ]);

  var STOP = new Set(['的','了','是','在','和','就','都','也','还','与','及','或','而',
    '被','把','让','使','对','从','到','向','为','以','之','其','这','那','有','无',
    '不','很','更','最','会','能','要','可','等','着','过','吗','呢','吧','啊','正','在']);

  function isRealWord(str) {
    if (str.length < 2 || str.length > 5) return false;
    if (STOP.has(str[0]) || STOP.has(str[str.length - 1])) return false;
    if (DICT.has(str)) return true;
    if (str.indexOf('人工智能') !== -1) return true;
    if (str.indexOf('智能') !== -1 && str.length <= 4) return true;
    if (str.indexOf('机器') !== -1 || str.indexOf('学习') !== -1) return true;
    if (str.indexOf('数据') !== -1 || str.indexOf('计算') !== -1) return true;
    if (str.indexOf('技术') !== -1 || str.indexOf('应用') !== -1) return true;
    return false;
  }

  minCountSlider.addEventListener('input', function() {
    minCountValue.textContent = minCountSlider.value;
  });

  clearBtn.addEventListener('click', function() {
    textInput.value = '';
    phrasesGrid.innerHTML = '<div class="empty">点击按钮查看结果</div>';
    statsText.textContent = '📊 高频词组';
    summaryPanel.style.display = 'none';
  });

  exampleBtn.addEventListener('click', function() {
    textInput.value = '人工智能正在改变世界。人工智能技术应用于各个领域，人工智能让生活更便捷。机器学习是人工智能的核心，深度学习推动人工智能发展。自然语言处理是人工智能的重要方向。人工智能的未来充满无限可能。智能语音助手、计算机视觉都是人工智能的典型应用。人工智能与大数据、云计算紧密结合。人工智能伦理也越来越受到关注。';
  });

  // ============ 词组提取 ============
  function extractPhrases(text, minCount) {
    if (!text || !text.trim()) return [];
    var clean = text.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, '');
    if (!clean) return [];
    var tokens = [];
    var regex = /[\u4e00-\u9fa5]|[a-zA-Z0-9]+/g;
    var match;
    while ((match = regex.exec(clean)) !== null) tokens.push(match[0]);
    if (tokens.length < 2) return [];

    var map = {};
    for (var n = 2; n <= 5; n++) {
      if (tokens.length < n) continue;
      for (var i = 0; i <= tokens.length - n; i++) {
        var phrase = tokens.slice(i, i + n).join('');
        if (!isRealWord(phrase)) continue;
        map[phrase] = (map[phrase] || 0) + 1;
      }
    }
    var result = [];
    for (var key in map) {
      if (map[key] >= minCount) result.push({ phrase: key, count: map[key] });
    }
    result.sort(function(a, b) {
      if (b.count !== a.count) return b.count - a.count;
      return b.phrase.length - a.phrase.length;
    });
    return result;
  }

  function render(phrases) {
    phrasesGrid.innerHTML = '';
    if (phrases.length === 0) {
      phrasesGrid.innerHTML = '<div class="empty">没有符合条件的词组，试试降低「最少出现」次数</div>';
      statsText.textContent = '📊 高频词组（共 0 个）';
      return;
    }
    statsText.textContent = '📊 高频词组（共 ' + phrases.length + ' 个）';
    for (var i = 0; i < phrases.length; i++) {
      var div = document.createElement('div');
      div.className = 'item';
      var span1 = document.createElement('span');
      span1.className = 'phrase';
      span1.textContent = phrases[i].phrase;
      var span2 = document.createElement('span');
      span2.className = 'count';
      span2.textContent = '出现 ' + phrases[i].count + ' 次';
      div.appendChild(span1);
      div.appendChild(span2);
      phrasesGrid.appendChild(div);
    }
  }

  // ============ 文本摘要（改进版，动态选句） ============
    // ============ 文本摘要（多维度打分版） ============
  function summarize(text) {
    if (!text || !text.trim()) return '';

    // 1. 按中文标点切句
    var sentences = text
      .replace(/\s+/g, '')
      .split(/(?<=[。！？!?；;])/)
      .map(function(s) { return s.trim(); })
      .filter(function(s) { return s.length >= 6; });

    if (sentences.length === 0) return text.slice(0, 120);
    if (sentences.length <= 2) return sentences.join('');

    // 2. 动态决定抽取句数
    var total = sentences.length;
    var pickCount;
    if (total <= 4) pickCount = 2;
    else if (total <= 8) pickCount = 3;
    else if (total <= 15) pickCount = 4;
    else if (total <= 25) pickCount = 5;
    else pickCount = 6;

    // 3. 统计词频
    var freq = {};
    for (var i = 0; i < sentences.length; i++) {
      var chars = sentences[i].match(/[\u4e00-\u9fa5]|[a-zA-Z0-9]+/g) || [];
      for (var j = 0; j < chars.length; j++) {
        var w = chars[j];
        if (STOP.has(w)) continue;
        freq[w] = (freq[w] || 0) + 1;
      }
    }

    // 4. 信号词 / 官方声明词 / 转折词
    var SIGNAL = ['提出','报告','意味着','首次','核心','方向','认为','强调',
                  '主张','例如','比如','表示','指出','显示','表明','发现',
                  '构建','探索','实现','路径','概念','框架','趋势','挑战'];
    var OFFICIAL = ['主办','承办','协办','支持','论坛由','冠名','赞助','出席',
                    '致辞','主持','召开','举办','合影','合影留念'];
    var TURN = ['但是','然而','因此','所以','不过','却','反而','总之','综上',
                '换言之','换句话说','更重要的是','关键在于'];

    // 5. 多维度打分
    var scored = sentences.map(function(s, idx) {
      var chars = s.match(/[\u4e00-\u9fa5]|[a-zA-Z0-9]+/g) || [];
      var len = s.length;

      // 维度一：词频得分（归一化）
      var scoreFreq = 0;
      for (var k = 0; k < chars.length; k++) {
        if (!STOP.has(chars[k])) scoreFreq += (freq[chars[k]] || 0);
      }
      scoreFreq = scoreFreq / Math.max(chars.length, 1);

      // 维度二：信号词得分
      var scoreSignal = 0;
      for (var m = 0; m < SIGNAL.length; m++) {
        if (s.indexOf(SIGNAL[m]) !== -1) scoreSignal += 1.2;
      }

      // 维度三：官方声明词降权
      var scoreOfficial = 0;
      for (var n = 0; n < OFFICIAL.length; n++) {
        if (s.indexOf(OFFICIAL[n]) !== -1) scoreOfficial -= 5;
      }

      // 维度四：转折词加分
      var scoreTurn = 0;
      for (var t = 0; t < TURN.length; t++) {
        if (s.indexOf(TURN[t]) !== -1) scoreTurn += 1.5;
      }

      // 维度五：位置加权（首尾句是主旨高发区）
      var posRatio = idx / sentences.length;
      var scorePos = 0;
      if (posRatio < 0.2) scorePos += 1.2;          // 开头 20%
      else if (posRatio < 0.4) scorePos += 0.6;     // 开头 20%~40%
      else if (posRatio > 0.8) scorePos += 0.8;     // 结尾 20%

      // 维度六：长度惩罚
      var scoreLen = 0;
      if (len < 15) scoreLen -= 1.5;
      else if (len > 120) scoreLen -= 0.8;
      else if (len >= 30 && len <= 80) scoreLen += 0.5; // 适中长度加分

      // 综合得分（各维度加权求和）
      var totalScore =
        scoreFreq * 0.35 +       // 词频权重最高
        scoreSignal * 1.0 +      // 信号词很重要
        scoreTurn * 0.8 +        // 转折词较重要
        scorePos * 0.6 +         // 位置中等权重
        scoreOfficial * 1.0 +    // 官方词直接降权
        scoreLen * 0.5;          // 长度辅助

      return { sentence: s, score: totalScore, index: idx };
    });

    // 6. 选 top N 句，但要避免内容重复（多样性维度）
    scored.sort(function(a, b) { return b.score - a.score; });

    var picked = [];
    for (var p = 0; p < scored.length && picked.length < pickCount; p++) {
      var candidate = scored[p];
      var isDuplicate = false;
      for (var q = 0; q < picked.length; q++) {
        // 如果两句有超过 60% 的字重复，视为重复
        if (similarity(candidate.sentence, picked[q].sentence) > 0.6) {
          isDuplicate = true;
          break;
        }
      }
      if (!isDuplicate) picked.push(candidate);
    }

    // 7. 按原文顺序拼接
    picked.sort(function(a, b) { return a.index - b.index; });
    return picked.map(function(item) { return item.sentence; }).join('');
  }

  // 计算两句相似度（基于字符集合的 Jaccard 系数）
  function similarity(a, b) {
    var setA = new Set(a.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, ''));
    var setB = new Set(b.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, ''));
    var intersection = 0;
    setA.forEach(function(ch) {
      if (setB.has(ch)) intersection++;
    });
    var union = setA.size + setB.size - intersection;
    return union === 0 ? 0 : intersection / union;
  }

  // ============ 事件绑定 ============
  extractBtn.addEventListener('click', function() {
    var text = textInput.value;
    var minCount = parseInt(minCountSlider.value, 10) || 2;
    render(extractPhrases(text, minCount));
  });

  summaryBtn.addEventListener('click', function() {
    var text = textInput.value;
    var summary = summarize(text);
    if (!summary) {
      summaryText.textContent = '没有可总结的内容，请先输入文本。';
    } else {
      summaryText.textContent = summary;
    }
    summaryPanel.style.display = 'block';
  });
})();
</script>
</body>
</html>
